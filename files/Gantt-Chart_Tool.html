<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Title</title>
<script>/* light / dark mode: ?theme= from the website, otherwise the last choice in this browser, otherwise the system setting */
(function(){var t=null;try{t=new URLSearchParams(location.search).get("theme");}catch(e){}
  if(t!=="dark"&&t!=="light"){try{t=localStorage.getItem("surveyPlanner.theme");}catch(e){}}
  if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);})();
/* font: the last choice in this browser (personal, like dark / light and language) */
window.FONTS=[["plex","IBM Plex Sans",'"IBM Plex Sans",system-ui,sans-serif',"IBM+Plex+Sans:wght@400;500;600"],
  ["inter","Inter",'"Inter",system-ui,sans-serif',"Inter:wght@400;500;600"],
  ["source","Source Sans 3",'"Source Sans 3",system-ui,sans-serif',"Source+Sans+3:wght@400;500;600"],
  ["serif","Source Serif 4",'"Source Serif 4",Georgia,serif',"Source+Serif+4:wght@400;500;600"],
  ["system","System font",'system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif',""]];
window.loadFonts=function(list){list.forEach(function(f){if(!f[3]||document.getElementById("font-"+f[0]))return;
  var l=document.createElement("link");l.id="font-"+f[0];l.className="fontlink";l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family="+f[3]+"&display=swap";document.head.appendChild(l);});};
window.useFont=function(id){var f=FONTS.find(function(x){return x[0]===id;})||FONTS[0];
  if(f[0]==="plex")document.documentElement.style.removeProperty("--font");else document.documentElement.style.setProperty("--font",f[2]);
  loadFonts([f]);return f[0];};
(function(){var id=null;try{id=localStorage.getItem("surveyPlanner.font");}catch(e){}if(id)useFont(id);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f6f3;--panel:#fff;--ink:#1d1f22;--muted:#71757c;--line:#e4e2dd;--accent:#1f5f8b;--soft:#e3edf5;--warn:#8a5a00;--warn-bg:#fff4d6;--dl:#b5532b;--bar:#9cc3e0;--bar-lock:#1a4a73;--ms:#1d1f22;--none-l:#a9adb3}
  :root{color-scheme:light}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#16181b;--panel:#1f2226;--ink:#e8e8e6;--muted:#9a9ea5;--line:#33373d;--accent:#6fa8d6;--soft:#24384a;--warn:#f0c46a;--warn-bg:#3a3020;--dl:#e08a62;--bar:#3f6f94;--bar-lock:#9fcbef;--ms:#e8e8e6;--none-l:#5c6066}}
  :root[data-theme=dark]{color-scheme:dark;--bg:#16181b;--panel:#1f2226;--ink:#e8e8e6;--muted:#9a9ea5;--line:#33373d;--accent:#6fa8d6;--soft:#24384a;--warn:#f0c46a;--warn-bg:#3a3020;--dl:#e08a62;--bar:#3f6f94;--bar-lock:#9fcbef;--ms:#e8e8e6;--none-l:#5c6066}
  .themebtn{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;color:var(--muted)}
  .themebtn:hover{color:var(--ink);border-color:var(--muted)}
  .themebtn svg{width:15px;height:15px}
  #langBtn{font-size:11px;font-weight:600;letter-spacing:.03em}
  .modebtns{display:inline-flex;gap:6px}
  #fontBtn{font-size:12px;font-weight:600}
  .fontwrap{position:relative;display:inline-block}
  .fontpop{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:45;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:6px;min-width:190px}
  .fontwrap.open .fontpop{display:block}
  .fontpop button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;width:calc(100% - 20px);padding:6px 10px;border-radius:5px;font-size:14px;color:var(--ink)}
  .fontpop button:hover{background:var(--soft)}
  .fontpop button .ok{color:var(--accent);font-size:12px}
  .themebtn .sun{display:none}
  :root.dark .themebtn .sun{display:block}
  :root.dark .themebtn .moon{display:none}
  :root.dark .ctx-del:hover{background:#3a2424}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font,"IBM Plex Sans",system-ui,sans-serif)}
  .wrap{max-width:1200px;margin:0 auto;padding:32px 20px 60px}
  header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:-32px -20px 22px;padding:16px 20px 12px;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
  h1{font-size:22px;font-weight:600;margin:0;flex:1;min-width:180px}
  #title{font:inherit;padding:2px 6px;margin-left:-7px;max-width:640px}
  .dl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  .me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .me input{width:200px;border-color:var(--line);text-overflow:ellipsis}
  select{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 4px;cursor:pointer}
  select:hover{border-color:var(--line)}
  select:focus{outline:none;border-color:var(--accent);background:var(--bg)}
  .me select{border-color:var(--line);padding:6px 8px}
  .filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
  .multi{position:relative;display:inline-block}
  .mbtn{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:6px 26px 6px 10px;min-width:90px;color:var(--ink);font-size:13px;position:relative;white-space:nowrap}
  .mbtn::after{content:"▾";position:absolute;right:9px;color:var(--muted)}
  .mpop{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:6px;min-width:160px}
  .multi.open .mpop{display:block}
  .mpop label{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:5px;cursor:pointer;color:var(--ink);font-size:13px}
  .mpop label:hover{background:var(--soft)}
  .mpop input{width:auto;margin:0;flex:none}
  .mhead{display:flex;justify-content:space-between;padding:0 8px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .mrow{display:flex;align-items:center;justify-content:space-between;border-radius:5px}
  .mrow:hover{background:var(--soft)}
  .mrow label:hover{background:none}
  .mrow .xbox{padding:5px 10px}
  .mrow input.exc{accent-color:#b5332b}
  .mcols{display:flex;gap:6px}
  .mcol{min-width:170px;max-width:280px}
  .mrow label:first-child{min-width:0}
  .mrow .mtx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mcol+.mcol{border-left:1px solid var(--line);padding-left:6px}
  .mtitle{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink);padding:4px 8px 4px}
  .mlist{max-height:340px;overflow:auto}
  .mdot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
  .mbtn{max-width:170px;overflow:hidden;text-overflow:ellipsis}
  .mreset{all:unset;cursor:pointer;display:block;margin:2px 0 2px;padding:4px 8px;color:var(--accent);font-size:12px;border-radius:5px}
  .mreset:hover{background:var(--soft)}
  .mclear{all:unset;cursor:pointer;display:block;margin-top:4px;padding:5px 8px;border-top:1px solid var(--line);color:var(--accent);font-size:12px;width:calc(100% - 16px)}
  .btns .hist{vertical-align:middle;margin-right:6px}
  .hist{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .hist button{all:unset;cursor:pointer;padding:4px 11px;font-size:16px;line-height:20px;color:var(--ink)}
  .hist button+button{border-left:1px solid var(--line)}
  .hist button:hover:not(:disabled){background:var(--soft)}
  .hist button:disabled{color:var(--line);cursor:default}
  tr.dim td{opacity:.35}
  .bar.dim{filter:grayscale(1);opacity:.3}
  .g-label.dim{opacity:.35}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
  input{font:inherit;color:var(--ink);background:transparent;border:1px solid transparent;border-radius:6px;padding:6px 8px;min-width:0;width:100%}
  input:hover{border-color:var(--line)}
  input:focus{outline:none;border-color:var(--accent);background:var(--bg)}
  table{width:100%;border-collapse:collapse}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:3px 2px;border-bottom:1px solid var(--line)}
  td.n{color:var(--muted);font-size:12px;width:26px;text-align:center}
  td.start{white-space:nowrap;width:150px}
  .x{all:unset;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:5px;opacity:.5}
  tr:hover .x{opacity:1}
  .x:hover{background:var(--line);color:var(--ink)}
  .fill{all:unset;cursor:pointer;color:var(--accent);font-weight:600;padding:4px 8px;border-radius:5px}
  .fill:hover{background:var(--soft)}
  tr.flash td{background:var(--soft);transition:background .6s}
  .add{all:unset;cursor:pointer;color:var(--accent);padding:10px 8px 2px;font-size:13px}
  .add.top{padding:0 8px 8px}
  input.newteam{width:110px;border-color:var(--accent);padding:5px 6px}
  .warn{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:8px 12px;margin-bottom:10px;font-size:13px}
  .sumrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}
  .seg button{all:unset;cursor:pointer;padding:4px 10px;font-size:12px;color:var(--muted)}
  .seg button.on{background:var(--ink);color:var(--panel)}
  .summary{display:flex;gap:28px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;color:var(--muted)}
  .summary b{color:var(--ink);font-weight:600;font-size:15px;margin-left:6px}
  .gantt{overflow-x:auto}
  .g-row{display:flex;height:30px;align-items:stretch}
  .g-label{position:sticky;left:0;z-index:2;background:var(--panel);width:220px;min-width:220px;padding-right:12px;display:flex;align-items:center;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g-row.g-sep{height:14px;background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
  .g-row.g-sep .g-label{background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat,var(--panel)}
  .g-track{position:relative;flex:none}
  .pastbtn{all:unset;cursor:pointer;position:absolute;top:5px;transform:translateX(-50%);font-size:11px;color:var(--muted);background:var(--panel);border:1px dashed var(--muted);border-radius:10px;padding:1px 8px;white-space:nowrap;z-index:3}
  .pastbtn:hover{color:var(--ink);border-style:solid}
  .g-row.moved,.g-row.moved .g-label{animation:movedFlash 2.2s ease-out}
  @keyframes movedFlash{0%,35%{background:var(--soft)}100%{background:var(--panel)}}
  .bar.cut{border-top-left-radius:0;border-bottom-left-radius:0}
  .bar.cutr{border-top-right-radius:0;border-bottom-right-radius:0}
  .zoombar{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:12px}
  .zscroll{position:relative;width:min(420px,50%);height:14px;border-radius:7px;background:var(--line);cursor:pointer}
  .zthumb{position:absolute;top:0;bottom:0;left:0;width:100%;border-radius:7px;background:var(--muted);opacity:.55;cursor:grab}
  .zthumb:hover{opacity:.8}
  .zh{position:absolute;top:-3px;bottom:-3px;width:9px;cursor:ew-resize;border-radius:4px}
  .zh.l{left:-2px}.zh.r{right:-2px}
  .zthumb:hover .zh,.zscroll.drag .zh{background:var(--ink);opacity:.5}
  .zscroll.drag .zthumb{cursor:grabbing;opacity:.9}
  .zoombar button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:2px 10px;font-size:13px;line-height:20px;color:var(--ink);min-width:12px;text-align:center}
  .zoombar button:hover{background:var(--soft)}
  .zoombar input[type=date]{width:auto;border-color:var(--line);padding:3px 6px;font-size:12px;margin:0 6px}
  .g-row.clip .g-track{overflow:hidden}
  .ctx{position:absolute;z-index:50;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.18);padding:12px}
  .ctx-t{font-weight:600;font-size:13px;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ctx-l{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 4px}
  .ctx-c{display:flex;gap:6px;flex-wrap:wrap}
  .ctx-c button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%}
  .ctx-c button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
  .ctx select,.ctx input{border-color:var(--line);width:100%}
  .ctx-del{all:unset;cursor:pointer;display:block;margin-top:12px;padding:6px 8px;border-top:1px solid var(--line);color:#b5332b;font-size:13px;width:calc(100% - 16px)}
  .ctx-del:hover{background:#fbeaea;border-radius:5px}
  .gname{outline:none;border-radius:4px;padding:1px 4px;margin-left:-4px;cursor:text;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .gname:hover{background:var(--soft)}
  .gname:focus{background:var(--bg);box-shadow:0 0 0 1px var(--accent);text-overflow:clip}
  .msl[contenteditable]{cursor:text;background:var(--panel);box-shadow:0 0 0 1px var(--accent);outline:none;border-radius:3px}
  .g-track.draw{cursor:crosshair;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(127,127,127,.06) 6px 12px)}
  .g-row.g-team{height:24px;border-top:1px solid var(--line)}
  .gdot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:7px;flex:none}
  .g-row.g-team .g-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
  .ms{position:absolute;top:0;bottom:0;border-left:2px solid var(--ms);z-index:1}
  .msl{cursor:grab;user-select:none;touch-action:none;z-index:3}
  .msl.dragging{cursor:grabbing;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.2);border-radius:3px}
  .msl{position:absolute;font-size:11px;font-weight:500;color:var(--ms);white-space:nowrap;padding-left:4px;line-height:16px}
  .msl.flip{padding-left:0;padding-right:4px}
  .msl.flip::before{left:auto;right:-1px}
  .msl::before{content:"";position:absolute;left:-1px;top:0;bottom:0;border-left:2px solid var(--ms)}
  h2{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 6px 8px}
  .mo{position:absolute;top:6px;font-size:11px;color:var(--muted);white-space:nowrap;padding-left:4px}
  .bar{position:absolute;z-index:2;top:7px;height:16px;border-radius:4px;background:var(--bar)}
  .bar{cursor:grab;touch-action:none;user-select:none}
  .bar.dragging{cursor:grabbing;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:4}
  .bar .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:1}
  .bar .h.l{left:-2px}.bar .h.r{right:-2px}
  .bar:hover .h{background:rgba(255,255,255,.35)}
  .bar .h.l:hover,.bar .h.r:hover{background:rgba(255,255,255,.6)}
  .bar .dt{display:none;font-style:normal}
  .bar:hover .dt,.bar.open .dt{display:inline}
  .bar:hover,.bar.open{z-index:3}
  .sw{all:unset;cursor:pointer;width:16px;height:16px;border-radius:50%;display:block;margin:auto;box-shadow:0 0 0 1px rgba(0,0,0,.15) inset}
  .pal{position:absolute;z-index:20;display:flex;gap:6px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12)}
  .pal button{all:unset;cursor:pointer;width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,var(--l) 50%,var(--d) 50%)}
  .pal button.blk{background:var(--ms)}
  .newcol{position:relative;width:20px;height:20px;border-radius:50%;border:1px dashed var(--muted);display:grid;place-items:center;font-size:14px;line-height:1;color:var(--muted);cursor:pointer;box-sizing:border-box}
  .newcol:hover{color:var(--ink);border-color:var(--ink)}
  .newcol input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;padding:0;border:0}
  .pal button.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
  th.sort{cursor:pointer;user-select:none}
  th.sort:hover,th.sort.on{color:var(--ink)}
  .bar span{position:absolute;left:100%;margin-left:6px;background:var(--panel);padding:0 3px;border-radius:3px;font-size:11px;color:var(--muted);white-space:nowrap;line-height:16px}
  .vline{position:absolute;top:0;bottom:0;border-left:2px solid var(--dl);z-index:1}
  .vline.today{border-left:2px dashed var(--muted)}
  .legtitle{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px 0;display:flex;align-items:center;gap:4px}
  .legwrap{display:flex;gap:44px;align-items:flex-start;flex-wrap:wrap}
  .legtog{all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;border-radius:4px;padding:1px 2px}
  .legtog:hover{color:var(--ink)}
  .legtog .chev{display:block;width:13px;height:13px;flex:none;transition:transform .15s}
  .legblock.closed .legtog .chev{transform:rotate(-90deg)}
  .legcount{font-weight:400;letter-spacing:0;cursor:pointer}
  .legname{outline:none;border-radius:4px;padding:1px 4px;margin-left:-2px;cursor:text;min-width:20px}
  .legname:hover{background:var(--soft);color:var(--ink)}
  .legname:focus{background:var(--bg);box-shadow:0 0 0 1px var(--accent);color:var(--ink)}
  .legadd{all:unset;cursor:pointer;color:var(--accent);font-size:15px;font-weight:500;line-height:1;padding:0 5px;border-radius:4px}
  .legadd:hover{background:var(--soft)}
  .legblock.closed .legend{display:none}
  .legend .rm{all:unset;cursor:pointer;color:var(--muted);opacity:.6;padding:0 4px;font-size:13px}
  .legend .rm:hover{opacity:1;color:var(--ink)}
  .legend i.tm{background:none;border:1.5px solid var(--muted);border-radius:50%;width:10px;height:10px;margin:0 2px}
  #teamLegend input,#whoLegend input{width:170px}
  .legend i.pm{background:none;border:1.5px solid var(--muted);border-radius:3px;width:10px;height:10px;margin:0 2px}
  .legend{display:flex;flex-direction:column;gap:2px;align-items:flex-start}   /* one column each */
  .legend label{display:flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:14px;height:12px;border-radius:3px;flex:none}
  .legend input{width:220px;padding:3px 6px;font-size:12px}
  .foot{display:flex;flex-direction:column;gap:16px;margin-top:14px;font-size:12px;color:var(--muted)}
  .foot .btns{align-self:flex-end}
  .btn{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;color:var(--ink)}
  .btn:hover{border-color:var(--muted)}
  .credit{margin:-10px 0 16px;text-align:center;font-size:11px;color:var(--muted)}
  .toggles{margin:-6px 0 18px;display:flex;gap:6px}
  .panel.hidden{display:none}
  .hint{font-size:12px;color:var(--muted);margin:10px 8px 0}
  #toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><input id="title" spellcheck="false" data-tt="Click to rename" title="Click to rename"></h1>
    <div class="filters">
      <span class="hist"><button class="undo" data-tt="Undo (Ctrl/Cmd+Z)" title="Undo (Ctrl/Cmd+Z)">↶</button><button class="redo" data-tt="Redo (Ctrl/Cmd+Shift+Z)" title="Redo (Ctrl/Cmd+Shift+Z)" disabled="">↷</button></span>
      <span class="me"><span data-t="Tasks">Tasks</span> <span class="multi" id="partFilter"></span></span>

}
const DAY=864e5;
const COLORS={ // dark = phase has dates, light = no dates yet
  blue:["#a6cbe8","#245d8f"], teal:["#a6dccf","#24806e"], green:["#c3dca4","#5a8230"], amber:["#f4d694","#ad7414"],

const colVal=k=>k&&COLORS[k]?COLORS[k][1]:(/^#[0-9a-f]{6}$/i.test(k||"")?k:null);
const keyOf=c=>{c=LEGACY[c]||c;return colVal(c)?c:"";};                               // "" = black, no category
const colOf=p=>keyOf(p.color);

function usedColors(){const u=new Set();[...S.phases,...S.milestones].forEach(x=>{const k=keyOf(x.color);if(k)u.add(k);});(S.packages||[]).forEach(k=>{if(colVal(k))u.add(k);});
  return [...Object.keys(COLORS).filter(k=>u.has(k)),...[...u].filter(k=>!COLORS[k])];}
function swatches(cur){

}

const add=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r};
const fmt=d=>`${WDS()[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;
const short=d=>`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.`;

function TEAMS(){const m=new Map(BUILTIN.map(([v,l])=>[v,t(l)]));[...S.phases,...S.milestones].forEach(x=>{if(x.part&&!m.has(x.part))m.set(x.part,x.part);});(S.teams||[]).forEach(v=>{if(!m.has(v))m.set(v,v);});return [...m];}   // teams added in the legend come after the ones in use

function askTeam(sel,done){

function defaults(){
  const t=new Date();t.setHours(0,0,0,0);
  return {nextId:DEFAULTS.length+1,
    phases:DEFAULTS.map(([name,weeks,pred],i)=>({id:i+1,name,who:"",dur:weeks*7,pred,start:null,end:null}))};

// (per plan) and win if they are newer than the embedded version.
let EMBED=null;try{EMBED=JSON.parse($("savedPlan").textContent);}catch(e){}
const KEY="surveyPlanner.v6"+(EMBED&&EMBED.planId?":"+EMBED.planId:":new-"+Math.random().toString(36).slice(2,10));   // unsaved template: fresh slot each time
let BASE=EMBED?(EMBED.savedAt||0):0;   // version of the file this browser backup belongs to
function load(){
  let local=null;try{local=JSON.parse(localStorage.getItem(KEY));}catch(e){}

    if(local&&local.state&&local.base===BASE&&(local.state.savedAt||0)>(EMBED.savedAt||0))return local.state;
    return EMBED;

}

// Writes a file: with a file picker where the browser has one (Chrome/Edge), otherwise as a download.
async function writeFile(content,suggested,mime,ext,handle){

/* ---------- dates ---------- */
// Each phase has a start date, an end date and a duration in calendar days (start and end day both count).
// Nothing is placed automatically: a phase appears in the chart once it has both dates.
const validD=d=>Number.isInteger(d)&&d>0;
const wkOf=p=>validD(p.dur)?Math.floor(p.dur/7):"";
const dyOf=p=>validD(p.dur)?p.dur%7:"";
const isDated=p=>!!(parse(p.start)&&parse(p.end));
function schedule(){
  const byId=new Map(S.phases.map(p=>[p.id,p]));
  const res=new Map(), warns=[];
  S.phases.filter(isDated).forEach(p=>{
    const s=parse(p.start),e=parse(p.end);
    if(e<s)warns.push(t("“{0}” ends ({1}) before it starts ({2}).",esc(p.name),fmt(e),fmt(s)));
    res.set(p.id,{start:s,end:e});
  });
  S.phases.forEach(p=>{
    const r=res.get(p.id); if(!r)return;
    (p.pred||[]).map(id=>byId.get(id)).filter(Boolean).forEach(q=>{const rq=res.get(q.id);
      if(rq&&rq.end>=r.start)warns.push(t("Overlap: “{0}” starts {1}, but “{2}” (which it comes after) only ends {3}.",esc(p.name),fmt(r.start),esc(q.name),fmt(rq.end)));});
  });
  return {res,warns};
}
// Typing only stores what you typed; the ✓ button in each row fills in the rest.
function applyEdit(p,f,val,tr){
  if(f==="wk"||f==="dy"){
    const num=k=>{const v=tr.querySelector(`[data-k="${k}"]`).value.trim();return v===""?null:Math.max(0,Math.floor(+v||0));};
    const w=num("wk"),d=num("dy");
    p.dur=(w===null&&d===null)?null:(w||0)*7+(d||0);
    if(!validD(p.dur))p.dur=null;
    return;
  }
  p[f]=parse(val)?val:null;
}
// ✓ Fill: both dates -> weeks/days; one date + weeks/days -> the other date.
function fillRow(p){
  const s=parse(p.start),e=parse(p.end);
  if(s&&e){p.dur=span(s,e);return true;}
  if(s&&validD(p.dur)){p.end=iso(add(s,p.dur-1));return true;}
  if(e&&validD(p.dur)){p.start=iso(add(e,-(p.dur-1)));return true;}
  return false;
}

/* ---------- editor ---------- */
// Phase numbers always follow the start date; the table can be ordered by start or end date.
let RANK=new Map(), BYRANK=[];
function orderTable(){
  const {res}=schedule(), idx=new Map(S.phases.map((p,i)=>[p.id,i]));
  const cmp=(k,o)=>(a,b)=>{const ra=res.get(a.id),rb=res.get(b.id);
    if(!ra||!rb)return (!ra&&!rb)?idx.get(a.id)-idx.get(b.id):(!ra?1:-1);   // undated phases at the bottom
    return (ra[k]-rb[k])||(ra[o]-rb[o])||(idx.get(a.id)-idx.get(b.id));};
  BYRANK=S.phases.slice().sort(cmp("start","end"));
  RANK=new Map(BYRANK.map((p,i)=>[p.id,i+1]));
  const key=S.tableSort==="end"?"end":"start";
  const top=c=>(a,b)=>{const ra=res.get(a.id),rb=res.get(b.id);if(!ra!==!rb)return !ra?-1:1;return c(a,b);};   // tasks without dates first (new ones)
  S.phases.sort(top(key==="end"?cmp("end","start"):cmp("start","end")));
  document.querySelectorAll("th.sort").forEach(th=>th.classList.toggle("on",th.dataset.s===key));
}

  $("body").innerHTML=S.phases.map((p,i)=>{

    return `<tr data-id="${p.id}">
      <td class="n">${RANK.get(p.id)}</td>
      <td><button class="sw" title="${esc(dimName("color"))}" style="background:${pairOf(p)[1]}"></button></td>
      <td><select data-k="part">${teamOptions(p.part)}</select></td>

      <td><input data-k="wk" type="number" min="0" step="1" placeholder="—" value="${wkOf(p)}"></td>
      <td><input data-k="dy" type="number" min="0" step="1" placeholder="—" value="${dyOf(p)}"></td>
      <td><input data-k="pred" placeholder="—" value="${after}"></td>

// Team filters (multi-select): nothing ticked = show everything; otherwise show items whose team is ticked.
// Kept in this browser only, like "Your name".
function multiFilter(id,key){
  // two groups side by side: labels (inc / exc) and colours (cinc / cexc); empty = no restriction
  let sel={inc:[],exc:[],cinc:[],cexc:[]};
  try{const v=JSON.parse(localStorage.getItem(key));if(Array.isArray(v))sel.inc=v;else if(v)sel={inc:v.inc||[],exc:v.exc||[],cinc:v.cinc||[],cexc:v.cexc||[]};}catch(e){}
  const el=$(id);let built="";
  const col=g=>`<div class="mcol"><div class="mtitle"></div><div class="mhead"><span></span><span></span></div><div class="mlist" data-g="${g}"></div><button type="button" class="mreset" data-g="${g}"></button></div>`;
  el.innerHTML=`<button type="button" class="mbtn"></button><div class="mpop"><div class="mcols">${col("t")}${col("c")}</div><button type="button" class="mclear"></button></div>`;
  const tnames=a=>TEAMS().filter(([v])=>a.includes(v)).map(([,l])=>l).join(", ");
  const cnames=a=>COLOPTS().filter(([v])=>a.includes(v)).map(([,l])=>l).join(", ");
  const part=(inc,exc,nm)=>!inc.length&&!exc.length?"":inc.length&&!exc.length?nm(inc):!inc.length?t("All except ")+nm(exc):nm(inc)+t(" · not ")+nm(exc);
  const label=()=>{const a=part(sel.inc,sel.exc,tnames),b=part(sel.cinc,sel.cexc,cnames);return a&&b?a+" · "+b:(a||b||t("Everything"));};
  const store=()=>{try{localStorage.setItem(key,JSON.stringify(sel))}catch(e){};refresh();update();};
  const rows=(list,dot)=>list.map(([v,l])=>`<div class="mrow"><label><input type="checkbox" class="inc" value="${esc(v)}">${dot?dot(v):""}<span class="mtx" title="${esc(l)}">${esc(l)}</span></label><label class="xbox" title="${t("Hide only {0}",esc(l))}"><input type="checkbox" class="exc" value="${esc(v)}"></label></div>`).join("");
  function refresh(){
    const tl=TEAMS(),cl=COLOPTS(),sig=JSON.stringify([tl,cl,dimName("label"),dimName("color")])+LANG;
    const okT=v=>tl.some(([k])=>k===v),okC=v=>cl.some(([k])=>k===v);
    sel.inc=sel.inc.filter(okT);sel.exc=sel.exc.filter(okT);sel.cinc=sel.cinc.filter(okC);sel.cexc=sel.cexc.filter(okC);   // entries that no longer exist are unticked
    if(sig!==built){built=sig;
      el.querySelectorAll(".mhead").forEach(h=>{h.children[0].textContent=t("Show");h.children[1].textContent=t("Hide");});
      const ti=el.querySelectorAll(".mtitle");ti[0].textContent=dimName("label");ti[1].textContent=dimName("color");
      el.querySelector(".mclear").textContent=t("Show everything");
      el.querySelectorAll(".mreset").forEach(r=>r.textContent=t("Reset {0}",dimName(r.dataset.g==="c"?"color":"label")));
      el.querySelector('.mlist[data-g="t"]').innerHTML=rows(tl);
      el.querySelector('.mlist[data-g="c"]').innerHTML=rows(cl,v=>`<i class="mdot" style="background:${v===NOCOL?"var(--ms)":colVal(v)}"></i>`);
      el.querySelectorAll(".mlist input").forEach(c=>c.onchange=()=>{
        const g=c.closest(".mlist").dataset.g==="c"?"c":"",v=c.value,on=c.checked,
          mine=g+(c.classList.contains("inc")?"inc":"exc"),other=g+(c.classList.contains("inc")?"exc":"inc");
        sel[mine]=on?[...new Set([...sel[mine],v])]:sel[mine].filter(x=>x!==v);
        if(on)sel[other]=sel[other].filter(x=>x!==v);              // can't be shown and hidden at once
        store();});}
    el.querySelectorAll('.mlist[data-g="t"] input.inc').forEach(c=>c.checked=sel.inc.includes(c.value));
    el.querySelectorAll('.mlist[data-g="t"] input.exc').forEach(c=>c.checked=sel.exc.includes(c.value));
    el.querySelectorAll('.mlist[data-g="c"] input.inc').forEach(c=>c.checked=sel.cinc.includes(c.value));
    el.querySelectorAll('.mlist[data-g="c"] input.exc').forEach(c=>c.checked=sel.cexc.includes(c.value));
    el.querySelectorAll(".mreset").forEach(r=>{const c=r.dataset.g==="c";r.style.visibility=(c?sel.cinc.length||sel.cexc.length:sel.inc.length||sel.exc.length)?"":"hidden";});   // only when something is set
    const lb=label();el.querySelector(".mbtn").textContent=lb;el.querySelector(".mbtn").title=lb;
  }
  el.querySelector(".mbtn").onclick=e=>{e.stopPropagation();document.querySelectorAll(".multi.open").forEach(o=>o!==el&&o.classList.remove("open"));el.classList.toggle("open");};
  el.querySelector(".mpop").addEventListener("click",e=>e.stopPropagation());
  el.querySelector(".mclear").onclick=()=>{sel={inc:[],exc:[],cinc:[],cexc:[]};store();};
  el.querySelectorAll(".mreset").forEach(r=>r.onclick=()=>{if(r.dataset.g==="c"){sel.cinc=[];sel.cexc=[];}else{sel.inc=[];sel.exc=[];}store();});
  const get=()=>sel;get.refresh=refresh;
  const keep=()=>{try{localStorage.setItem(key,JSON.stringify(sel))}catch(e){}};
  get.rename=(o,n)=>{const f=a=>[...new Set(a.map(v=>v===o?n:v))];sel.inc=f(sel.inc);sel.exc=f(sel.exc);keep();};
  get.recolor=(o,n)=>{const f=a=>[...new Set(a.map(v=>v===o?n:v))];sel.cinc=f(sel.cinc);sel.cexc=f(sel.cexc);keep();};

function update(){
  renderLegend();
  PARTSEL.refresh();MSPARTSEL.refresh();
  save();
  const {res,warns}=schedule();
  LAST=res;
  ROWS=S.phases.filter(p=>res.has(p.id)&&shown(p)).map(p=>({p,...res.get(p.id)}));
  document.querySelectorAll("#body tr").forEach(tr=>{
    const p=S.phases.find(q=>q.id===+tr.dataset.id); if(!p)return;
    tr.classList.toggle("dim",!mine(p));
    tr.style.display=shown(p)?"":"none";
    [["start",p.start||""],["end",p.end||""],["wk",wkOf(p)],["dy",dyOf(p)]].forEach(([k,v])=>{const i=tr.querySelector(`[data-k="${k}"]`);if(document.activeElement!==i)i.value=v;});
  });
  const today=new Date();today.setHours(0,0,0,0);
  // the chart is always drawn, even with no phases (e.g. only milestones)
  const has=ROWS.length>0;
  const start=has?ROWS.reduce((m,r)=>r.start<m?r.start:m,ROWS[0].start):null;
  const end=has?ROWS.reduce((m,r)=>r.end>m?r.end:m,ROWS[0].end):null;
  $("warnings").innerHTML=[...new Set(warns)].map(w=>`<div class="warn">${w}</div>`).join("");
  const daysLeft=has?Math.round((start-today)/DAY):-1;
  $("summary").innerHTML=!has?"":`<span>${t("Start")}<b>${fmt(start)}</b></span><span>${t("End")}<b>${fmt(end)}</b></span><span>${t("Total")}<b>${(()=>{const d=span(start,end),w=Math.floor(d/7),r=d%7;return `${w} ${t(w===1?"week":"weeks")}${r?` ${r} ${t(r===1?"day":"days")}`:""}`;})()}</b></span>`+
    (daysLeft>=0?`<span>${t("Until start")}<b>${daysLeft} ${t(daysLeft===1?"day":"days")}</b></span>`:"");
  document.querySelectorAll("#msBody tr").forEach(tr=>{const m=S.milestones[+tr.dataset.i];if(m)tr.style.display=shownMs(m)?"":"none";});
  const ms=S.milestones.filter(m=>parse(m.date)&&shownMs(m)).map(m=>({d:parse(m.date),label:m.label||"",c:MSCOL(m.color),i:S.milestones.indexOf(m)})).sort((a,b)=>a.d-b.d);
  let gA=start,gB=end;
  ms.forEach(m=>{if(!gA||m.d<gA)gA=m.d;if(!gB||m.d>gB)gB=m.d;});
  if(!gA){gA=today;gB=add(today,12*7);}           // nothing at all yet: show the next 12 weeks
  // by default the chart starts one week before today; the button on the today line shows everything
  const hasPast=gA<add(today,-7), clipped=hasPast&&!SHOWPAST;
  if(clipped)gA=today;
  if(gB<gA)gB=gA;
  if((gB-gA)/DAY<28)gB=add(gA,28);                  // keep a readable minimum width
  // zoom: show a window of the full range (ZOOM.span days starting ZOOM.from days after the full start)
  let full0=add(gA,-7),full1=add(gB,14);ZOOM.base0=full0;ZOOM.base1=full1;
  if(ZOOM.ext){if(ZOOM.ext[0]<full0)full0=ZOOM.ext[0];if(ZOOM.ext[1]>full1)full1=ZOOM.ext[1];}   // typed dates may lie outside the plan
  const fullDays=Math.round((full1-full0)/DAY);
  if(ZOOM.want){ZOOM.from=Math.round((ZOOM.want[0]-full0)/DAY);ZOOM.span=Math.round((ZOOM.want[1]-ZOOM.want[0])/DAY);ZOOM.want=null;}
  let exact=null;
  if(ZOOM.span&&ZOOM.span<fullDays){
    ZOOM.from=Math.min(Math.max(0,ZOOM.from),fullDays-ZOOM.span);
    exact=[add(full0,ZOOM.from),add(full0,ZOOM.from+ZOOM.span)];
  } else {ZOOM.span=0;ZOOM.from=0;}
  ZOOM.fullDays=fullDays;ZOOM.full0=full0;
  const th=document.querySelector(".zthumb");
  th.style.left=(ZOOM.span?ZOOM.from/fullDays*100:0)+"%";th.style.width=(ZOOM.span?ZOOM.span/fullDays*100:100)+"%";
  // the two date fields show the first and last date currently visible
  const shown0=exact?exact[0]:full0, shown1=exact?exact[1]:full1;
  [["zFrom",shown0],["zTo",shown1]].forEach(([id,d])=>{if(document.activeElement!==$(id))$(id).value=iso(d);});
  gantt(gA,gB,today,ms,{hasPast,clipped,exact,full0,full1,cut:clipped?full0:null});
  renderLegend();                                   // after the chart, so the legend can follow its order
  renderTeams();renderPeople();
}
// Drag a bar to move it (same duration); drag its left/right edge to change start/end. A plain click shows the dates.
const GX={px:1};
let DRAG=null;
$("gantt").addEventListener("pointerdown",e=>{
  const bar=e.target.closest(".bar");if(!bar||e.button!==0)return;
  const p=S.phases.find(q=>q.id===+bar.dataset.id);if(!p||!isDated(p))return;
  e.preventDefault();bar.setPointerCapture(e.pointerId);
  const mode=e.target.classList.contains("l")?"l":e.target.classList.contains("r")?"r":"m";
  DRAG={bar,p,mode,x0:e.clientX,s0:parse(p.start),e0:parse(p.end),L0:parseFloat(bar.style.left),moved:false,ns:parse(p.start),ne:parse(p.end)};
  bar.classList.add("dragging");
});
$("gantt").addEventListener("pointermove",e=>{
  if(!DRAG)return;
  const dx=e.clientX-DRAG.x0;if(Math.abs(dx)>3)DRAG.moved=true;
  const dd=Math.round(dx/GX.px);let ns=DRAG.s0,ne=DRAG.e0;
  if(DRAG.mode==="m"){ns=add(DRAG.s0,dd);ne=add(DRAG.e0,dd);}
  else if(DRAG.mode==="l"){ns=add(DRAG.s0,dd);if(ns>DRAG.e0)ns=new Date(DRAG.e0);}
  else{ne=add(DRAG.e0,dd);if(ne<DRAG.s0)ne=new Date(DRAG.s0);}
  DRAG.ns=ns;DRAG.ne=ne;
  DRAG.bar.style.left=(DRAG.L0+Math.round((ns-DRAG.s0)/DAY)*GX.px)+"px";
  DRAG.bar.style.width=(span(ns,ne)*GX.px)+"px";
  const dt=DRAG.bar.querySelector(".dt");if(dt)dt.textContent=`${short(ns)}–${short(ne)} · ${span(ns,ne)} ${t("days")}`;
  DRAG.bar.classList.add("open");
});
function endDrag(){
  if(!DRAG)return;const d=DRAG;DRAG=null;d.bar.classList.remove("dragging");
  if(!d.moved){d.bar.classList.toggle("open");return;}
  LASTPUSH=0;                                    // every drag is its own undo step
  d.p.start=iso(d.ns);d.p.end=iso(d.ne);d.p.dur=span(d.ns,d.ne);
  renderEditor();update();
}
$("gantt").addEventListener("pointerup",endDrag);

let SHOWPAST=false;try{SHOWPAST=localStorage.getItem("surveyPlanner.showPast")==="1";}catch(e){}
const ZOOM={span:0,from:0,fullDays:0};
// Changing the visible window glides there (~0.6 s) instead of jumping.
let TWEEN=0;
function tweenTo(tFrom,tSpan,done){
  const f0=ZOOM.span?ZOOM.from:0, s0=ZOOM.span||ZOOM.fullDays, t0=performance.now(), id=++TWEEN, D=600;
  const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  const step=now=>{
    if(id!==TWEEN)return;                                 // a newer change took over
    const k=Math.min(1,(now-t0)/D),e=ease(k);
    ZOOM.from=Math.round(f0+(tFrom-f0)*e);ZOOM.span=Math.max(1,Math.round(s0+(tSpan-s0)*e));
    update();
    if(k<1)requestAnimationFrame(step);else if(done)done();
  };
  requestAnimationFrame(step);
}
function zoomBy(f){
  const full=ZOOM.fullDays||1,span=ZOOM.span||full,center=(ZOOM.span?ZOOM.from:0)+span/2;
  const ns=Math.round(Math.min(full,Math.max(14,span*f)));
  if(ns>=full)tweenTo(0,full,()=>{ZOOM.span=0;ZOOM.from=0;update();});
  else tweenTo(Math.min(Math.max(0,Math.round(center-ns/2)),full-ns),ns);
}
// pull bar: drag the thumb to move the visible window, or drag its left / right end to zoom
let ZDRAG=null;
document.querySelector(".zscroll").addEventListener("pointerdown",e=>{
  const bar=e.currentTarget,w=bar.getBoundingClientRect().width,full=ZOOM.fullDays;
  const mode=e.target.classList.contains("l")?"l":e.target.classList.contains("r")?"r":"m";
  if(mode==="m"&&!ZOOM.span)return;                  // whole plan visible: nothing to move (the ends still work)
  if(!ZOOM.span){ZOOM.span=full;ZOOM.from=0;}
  if(mode==="m"&&!e.target.closest(".zthumb")){       // click beside the thumb: centre the window there
    ZOOM.from=Math.round((e.clientX-bar.getBoundingClientRect().left)/w*full-ZOOM.span/2);update();}
  e.preventDefault();bar.setPointerCapture(e.pointerId);bar.classList.add("drag");
  TWEEN++;ZDRAG={mode,x0:e.clientX,f0:ZOOM.from,s0:ZOOM.span,w};
});
document.querySelector(".zscroll").addEventListener("pointermove",e=>{
  if(!ZDRAG)return;
  const full=ZOOM.fullDays,dd=Math.round((e.clientX-ZDRAG.x0)/ZDRAG.w*full),MIN=14;
  let f=ZDRAG.f0,sp=ZDRAG.s0;
  if(ZDRAG.mode==="m")f=ZDRAG.f0+dd;
  else if(ZDRAG.mode==="l"){f=Math.min(ZDRAG.f0+ZDRAG.s0-MIN,Math.max(0,ZDRAG.f0+dd));sp=ZDRAG.f0+ZDRAG.s0-f;}
  else sp=Math.max(MIN,Math.min(full-ZDRAG.f0,ZDRAG.s0+dd));
  if(f!==ZOOM.from||sp!==ZOOM.span){ZOOM.from=f;ZOOM.span=sp;update();}
});

// typing a first / last date: show exactly that period

$("gantt").addEventListener("dblclick",e=>{if(!e.target.closest(".bar,.msl,.gname,button,.g-track.draw"))zoomFit();});
function gantt(a,b,today,ms,view){

  // height of the milestone row is taken from the whole plan, so zooming/moving never changes the chart height
  let fullLevels=0;
  if(ex){const fp=Math.max(1,Math.min(16,(Math.max(500,($("gantt").parentElement.clientWidth||900)-222))/(Math.round((view.full1-view.full0)/DAY)+1))),fe=[];
    ms.forEach(m=>{const t=`${short(m.d)} ${m.label}`,a=Math.round((m.d-view.full0)/DAY)*fp,b=a+textW(t)+10;let l=fe.findIndex(e=>e<a);if(l<0){l=fe.length;fe.push(-1e9);}fe[l]=b;});
    fullLevels=fe.length;}
  const msAll=ms;ms=ms.filter(m=>m.d>=g0&&m.d<=g1);   // only milestones inside the visible window are drawn
  const days=Math.round((g1-g0)/DAY)+1;
  const avail=Math.max(500,($("gantt").parentElement.clientWidth||900)-222);
  const px=Math.max(1,Math.min(16,avail/days));let W=Math.ceil(days*px);GX.px=px;GX.g0=g0;const x=d=>Math.round((d-g0)/DAY)*px;

  ms.forEach(m=>grid+=`<div class="ms" data-mi="${m.i}" style="left:${x(m.d)}px;border-color:${m.c}" title="${esc(m.label)} · ${fmt(m.d)}"></div>`);
  const ends=[];let lab="";
  ms.forEach(m=>{const t=`${short(m.d)} ${m.label}`,L=x(m.d),w=textW(t)+10,flip=false;
    const a=L,b=L+w;
    let lv=ends.findIndex(e=>e<a);if(lv<0){lv=ends.length;ends.push(-1e9);}ends[lv]=b;
    lab+=`<div class="msl${flip?" flip":""}" data-mi="${m.i}" style="${flip?`right:${W-L}px`:`left:${L}px`};top:${3+lv*17}px;${m.c.startsWith("var")?"":"--ms:"+m.c}" title="${esc(m.label)} · ${fmt(m.d)}">${esc(t)}</div>`;});
  if(ends.length&&!ex)W=Math.max(W,Math.ceil(Math.max(...ends))+10); // labels always to the right; scroll if needed (not when zoomed)

  const msRow=msAll.length?`<div class="g-row${ex?" clip":""}" style="height:${levels*17+6}px"><div class="g-label"></div><div class="g-track" style="width:${W}px">${lab}</div></div>`:"";
  if(today>=g0&&today<=g1)grid+=`<div class="vline today" style="left:${x(today)}px"></div>`;
  let mo="";
  for(let d=new Date(g0.getFullYear(),g0.getMonth()+1,1);d<=g1;d=new Date(d.getFullYear(),d.getMonth()+1,1))
    mo+=`<div class="mo" style="left:${x(d)}px">${MOS()[d.getMonth()]} ${px*30<62?"’"+String(d.getFullYear()).slice(2):d.getFullYear()}</div>`;   // shorter year when months are narrow
  let h=msRow+`<div class="g-row" style="height:26px"><div class="g-label"><button class="add" id="gAdd" style="padding:0">${LANG==="de"?"+ Aufgabe":"+ Add task"}</button><button class="add" id="gAddMs" style="padding:0 0 0 14px">${LANG==="de"?"+ Meilenstein":"+ Add milestone"}</button></div><div class="g-track" style="width:${W}px">${mo}${ms.map(m=>`<div class="ms" data-mi="${m.i}" style="left:${x(m.d)}px;border-color:${m.c}"></div>`).join("")}</div></div>`;
  const gStart={};ROWS.forEach(r=>{const c=colOf(r.p);if(!gStart[c]||r.start<gStart[c])gStart[c]=r.start;});
  const mode=["group","team"].includes(S.ganttSort)?S.ganttSort:"start", byGroup=mode!=="start";
  document.querySelectorAll("#gsort button").forEach(b=>b.classList.toggle("on",b.dataset.o===mode));
  // grouping key: colour (work package) or team; "All" first, then the teams in the order they appear
  const TL=TEAMS(),TEAMORD=TL.map(([v])=>v), teamOf=p=>p.part&&TEAMORD.includes(p.part)?p.part:"all";
  const key=p=>mode==="team"?teamOf(p):colOf(p);
  // work packages are kept together by the team most of their tasks belong to (teams in list order), then by start
  const dom={};{const cnt={};ROWS.forEach(r=>{const c=colOf(r.p),t=teamOf(r.p);(cnt[c]=cnt[c]||{})[t]=(cnt[c][t]||0)+1;});
    Object.entries(cnt).forEach(([c,o])=>{dom[c]=Object.entries(o).sort((x,y)=>y[1]-x[1]||TEAMORD.indexOf(x[0])-TEAMORD.indexOf(y[0]))[0][0];});}
  const gcmp=(a,b)=>mode==="team"?TEAMORD.indexOf(teamOf(a.p))-TEAMORD.indexOf(teamOf(b.p))
    :(TEAMORD.indexOf(dom[colOf(a.p)])-TEAMORD.indexOf(dom[colOf(b.p)]))||(gStart[colOf(a.p)]-gStart[colOf(b.p)])||(colOf(a.p)<colOf(b.p)?-1:colOf(a.p)>colOf(b.p)?1:0);
  let prevGroup=null;GX.view={g0,g1,ms,order:[]};
  const SORTED=ROWS.slice().sort((a,b)=>(byGroup?gcmp(a,b):0)||(a.start-b.start)||(a.end-b.end));

      :{name:(S.colorLabels||{})[g]||(dimCustom("color")?t(g?"Unnamed":"None"):t(g?"Unnamed colour":"No colour")),color:colVal(g)||"var(--ms)"};
    if(byGroup){const g=key(r.p);if(g!==prevGroup)GX.view.order.push({head:head(g)});}

      prevGroup=g;}
    const who=people(r.p).length?" · "+esc(people(r.p).join(", ")):"";
    h+=`<div class="g-row"><div class="g-label${mine(r.p)?"":" dim"}" title="${esc(r.p.name)}"><span class="gname" contenteditable="plaintext-only" spellcheck="false" data-id="${r.p.id}">${esc(r.p.name)}</span></div>
      <div class="g-track" style="width:${W}px">${grid}
      ${r.end<g0||r.start>g1?"":`<div class="bar${mine(r.p)?"":" dim"}${x(r.start)<0?" cut":""}${x(add(r.end,1))>W?" cutr":""}" data-id="${r.p.id}" style="background:${pairOf(r.p)[1]};left:${Math.max(0,x(r.start))}px;width:${Math.max(px,Math.min(W,x(add(r.end,1)))-Math.max(0,x(r.start)))}px" title="${esc(r.p.name)}: ${fmt(r.start)} – ${fmt(r.end)}"><i class="h l"></i><i class="h r"></i><span><em class="dt">${short(r.start)}–${short(r.end)}${who}</em></span></div>`}
      </div></div>`;
  });
  S.phases.filter(p=>!isDated(p)&&shown(p)).forEach(p=>{
    h+=`<div class="g-row"><div class="g-label${mine(p)?"":" dim"}"><span class="gname" contenteditable="plaintext-only" spellcheck="false" data-id="${p.id}">${esc(p.name)}</span></div>
      <div class="g-track draw" data-id="${p.id}" style="width:${W}px" title="${t("Drag here to set the dates")}">${grid}</div></div>`;
  });
  if(view&&view.hasPast&&today>=g0&&today<=g1)   // "Show all / Hide past" stays at the bottom of the today line
    h+=`<div class="g-row"><div class="g-label"></div><div class="g-track" style="width:${W}px"><button class="pastbtn" style="left:${x(today)}px" title="${t(view.clipped?"Show the whole plan, including what is already over":"Start the chart at today again")}">${t(view.clipped?"◀ Show all":"Hide past ▶")}</button></div></div>`;

  // remember where each task row was, so rows that change place can glide to their new spot
  const before=new Map();
  $("gantt").querySelectorAll(".gname[data-id]").forEach(n=>before.set(n.dataset.id,n.closest(".g-row").getBoundingClientRect().top));
  $("gantt").innerHTML=h;

  }

}

    const cur=keyOf(item.color);

      <div class="ctx-l">${esc(dimName("color"))}</div>

/* ---------- right-click a work package in the legend: recolour the whole package ---------- */
function recolourPackage(from,to){
  if(!to||to===from)return;
  const merge=usedColors().includes(to);
  LASTPUSH=0;
  [...S.phases,...S.milestones].forEach(x=>{if(keyOf(x.color)===from)x.color=to;});
  S.packages=[...new Set((S.packages||[]).map(k=>k===from?to:k))];
  PARTSEL.recolor(from,to);MSPARTSEL.recolor(from,to);
  const lab=S.colorLabels||{};
  if(!merge||!lab[to])lab[to]=lab[from]||"";        // the label goes with the colour (an existing package keeps its own label)
  delete lab[from];
  LEGKEY="";closeCtx();renderEditor();renderMs();update();
  if(merge)toast(t("Merged with the colour already in use – undo with ↶"));
}

/* Export table: the phases currently shown in the list, as CSV for Excel (semicolon-separated, German date format). */
$("exportTable").onclick=async()=>{
  const d=x=>{const t=parse(x);return t?`${String(t.getDate()).padStart(2,"0")}.${String(t.getMonth()+1).padStart(2,"0")}.${t.getFullYear()}`:"";};
  const c=v=>{v=String(v??"");return /[;"\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v;};
  const partName=v=>(TEAMS().find(([k])=>k===(v||"all"))||["",v])[1];
  const rows=S.phases.filter(shown).map(p=>[RANK.get(p.id),partName(p.part),p.name,p.who||"",wkOf(p),dyOf(p),
    (p.pred||[]).map(id=>RANK.get(id)).filter(Boolean).sort((a,b)=>a-b).join(", "),d(p.start),d(p.end),(S.colorLabels||{})[colOf(p)]||""]);
  const csv="﻿"+[["Nr",dimName("label"),"Task",dimName("who"),"Weeks","Days","After #","Start","End",dimName("color")].map((h,i)=>i===1||i===3||i===9?h:t(h)),...rows].map(r=>r.map(c).join(";")).join("\r\n");
  try{if(await writeFile(new Blob([csv],{type:"text/csv"}),slug(S.title)+"-phases.csv","text/csv","csv",null))toast(t("Table exported"));}
  catch(e){if(e&&e.name!=="AbortError")toast(t("Could not export: ")+(e.message||e));}
};

/* Export Gantt: draws the chart as it is currently displayed (filters, order) into a PNG. */
function ganttCanvas(){
  const V=GX.view;if(!V)return null;
  const solid=c=>!c||String(c).startsWith("var")?"#1d1f22":c;
  const days=Math.round((V.g1-V.g0)/DAY)+1, P=Math.min(10,Math.max(2,1600/days));
  const LW=250, PAD=24, W=LW+Math.ceil(days*P)+PAD*2, x=d=>PAD+LW+Math.round((d-V.g0)/DAY)*P;
  const F=(w,sz)=>`${w} ${sz}px ${fontCss()}`;
  const meas=document.createElement("canvas").getContext("2d");meas.font=F(500,11);
  // milestone label levels (same stacking as on screen)
  const lv=[],ends=[];V.ms.forEach(m=>{const t=`${short(m.d)} ${m.label}`,a=x(m.d),b=a+meas.measureText(t).width+12;let l=ends.findIndex(e=>e<a);if(l<0){l=ends.length;ends.push(-1e9);}ends[l]=b;lv.push({m,t,l});});
  const extra=Math.max(0,...ends)-W+PAD; const Wt=W+Math.max(0,extra);
  const legend=[...$("legend").querySelectorAll("label[data-k]")].map(l=>l.dataset.k).filter(k=>V.order.some(r=>r&&r.p&&colOf(r.p)===k)||V.ms.some(m=>m.c===colVal(k)));
  const TITLE=44, MSH=ends.length?ends.length*17+8:0, MON=24, RH=26, SEP=12;
  const HEAD=24;
  const body=V.order.reduce((s,r)=>s+(r&&r.head?HEAD:r?RH:SEP),0)||RH;
  const LEG=legend.length?legend.length*18+16+18:0;
  const H=PAD+TITLE+MSH+MON+body+LEG+PAD+18;
  const k=2,cv=document.createElement("canvas");cv.width=Wt*k;cv.height=H*k;
  const g=cv.getContext("2d");g.scale(k,k);g.fillStyle="#fff";g.fillRect(0,0,Wt,H);g.textBaseline="middle";
  g.fillStyle="#1d1f22";g.font=F(600,18);g.fillText(S.title||TITLE_DEFAULT,PAD,PAD+14);
  const top=PAD+TITLE, chartTop=top+MSH, rowsTop=chartTop+MON, bottom=rowsTop+body;
  // week grid
  g.strokeStyle="#e4e2dd";g.lineWidth=1;
  for(let d=new Date(V.g0);d<=V.g1;d=add(d,1))if(d.getDay()===1){g.beginPath();g.moveTo(x(d)+.5,chartTop);g.lineTo(x(d)+.5,bottom);g.stroke();}
  // months
  g.fillStyle="#71757c";g.font=F(400,11);
  for(let d=new Date(V.g0.getFullYear(),V.g0.getMonth()+1,1);d<=V.g1;d=new Date(d.getFullYear(),d.getMonth()+1,1))g.fillText(`${MOS()[d.getMonth()]} ${d.getFullYear()}`,x(d)+4,chartTop+12);
  // milestones
  lv.forEach(({m,t,l})=>{const c=solid(m.c),y=top+3+l*17;g.strokeStyle=c;g.lineWidth=2;g.beginPath();g.moveTo(x(m.d)+1,y);g.lineTo(x(m.d)+1,bottom);g.stroke();
    g.fillStyle=c;g.font=F(500,11);g.fillText(t,x(m.d)+6,y+8);});
  // today
  const today=new Date();today.setHours(0,0,0,0);
  if(today>=V.g0&&today<=V.g1){g.save();g.setLineDash([4,3]);g.strokeStyle="#71757c";g.lineWidth=1.5;g.beginPath();g.moveTo(x(today)+.5,chartTop);g.lineTo(x(today)+.5,bottom);g.stroke();g.restore();}
  // rows
  let y=rowsTop;
  V.order.forEach(r=>{
    if(!r){g.strokeStyle="#c9c6bf";g.lineWidth=1;g.beginPath();g.moveTo(PAD,y+SEP/2+.5);g.lineTo(Wt-PAD,y+SEP/2+.5);g.stroke();y+=SEP;return;}
    if(r.head){g.strokeStyle="#e4e2dd";g.lineWidth=1;g.beginPath();g.moveTo(PAD,y+.5);g.lineTo(Wt-PAD,y+.5);g.stroke();
      let tx=PAD;if(r.head.color){g.fillStyle=solid(r.head.color);g.fillRect(PAD,y+HEAD/2-4,9,9);tx+=16;}
      g.fillStyle="#71757c";g.font=F(600,10.5);g.fillText(r.head.name.toUpperCase(),tx,y+HEAD/2+1);y+=HEAD;return;}
    g.globalAlpha=mine(r.p)?1:.35;
    g.fillStyle="#1d1f22";g.font=F(400,12.5);
    let nm=r.p.name;while(g.measureText(nm).width>LW-14&&nm.length>3)nm=nm.slice(0,-2);if(nm!==r.p.name)nm+="…";
    g.fillText(nm,PAD,y+RH/2);
    if(r.end<V.g0||r.start>V.g1){g.globalAlpha=1;y+=RH;return;}
    const bx=Math.max(PAD+LW,x(r.start)),bw=Math.max(P,Math.min(x(add(V.g1,1)),x(add(r.end,1)))-bx),by=y+6,bh=RH-12,rad=Math.min(4,bw/2);
    g.fillStyle=solid(pairOf(r.p)[1]);g.beginPath();g.moveTo(bx+rad,by);g.arcTo(bx+bw,by,bx+bw,by+bh,rad);g.arcTo(bx+bw,by+bh,bx,by+bh,rad);g.arcTo(bx,by+bh,bx,by,rad);g.arcTo(bx,by,bx+bw,by,rad);g.fill();
    g.globalAlpha=1;y+=RH;
  });
  if(!V.order.length){g.fillStyle="#71757c";g.font=F(400,12);g.fillText(t("No phases"),PAD,rowsTop+RH/2);}
  // legend
  let ly=bottom+16;
  if(legend.length){g.fillStyle="#71757c";g.font=F(600,10.5);g.fillText(dimName("color").toUpperCase(),PAD,ly+8);ly+=20;}
  legend.forEach(k2=>{g.fillStyle=colVal(k2);g.fillRect(PAD,ly+3,14,12);g.fillStyle="#1d1f22";g.font=F(400,12);g.fillText((S.colorLabels||{})[k2]||"",PAD+22,ly+9);ly+=18;});
  g.fillStyle="#9a9ea5";g.font=F(400,10);g.textAlign="center";g.fillText(creditText(),Wt/2,H-PAD/2-6);g.textAlign="left";
  return cv;
}
$("exportPng").onclick=async()=>{
  const cv=ganttCanvas();if(!cv){toast(t("Nothing to export"));return;}
  try{await document.fonts.ready;}catch(e){}
  const blob=await new Promise(r=>ganttCanvas().toBlob(r,"image/png"));
  try{if(await writeFile(blob,slug(S.title)+"-gantt.png","image/png","png",null))toast(t("Gantt chart exported"));}
  catch(e){if(e&&e.name!=="AbortError")toast(t("Could not export: ")+(e.message||e));}
};

let FONT="plex";try{FONT=localStorage.getItem("surveyPlanner.font")||"plex";}catch(e){}
function paintFonts(){
  $("fontPop").innerHTML=FONTS.map(([id,name,css])=>`<button type="button" data-f="${id}" style="font-family:${esc(css)}"><span>${esc(t(name))}</span>${id===FONT?'<span class="ok">✓</span>':""}</button>`).join("");
}

  if(!w.classList.contains("open")){loadFonts(FONTS);paintFonts();}w.classList.toggle("open");};
